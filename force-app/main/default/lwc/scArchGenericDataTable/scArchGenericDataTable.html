<template>
    <lightning-card title={title} icon-name="standard:table">
        <div class="slds-p-around_small">
            <div class="slds-grid slds-gutters_small slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input
                        label="From Date"
                        type="date"
                        value={dateFrom}
                        onchange={handleDateFromChange}
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input
                        label="To Date"
                        type="date"
                        value={dateTo}
                        onchange={handleDateToChange}
                    ></lightning-input>
                </div>
            </div>

            <div class="slds-m-bottom_small">
                <lightning-button label="Get" onclick={handleGetData}></lightning-button>
            </div>

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading records" size="small"></lightning-spinner>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-m-bottom_small">{errorMessage}</div>
            </template>

            <template if:true={hasRows}>
                <lightning-datatable
                    key-field="Id"
                    data={rows}
                    columns={columns}
                    hide-checkbox-column
                ></lightning-datatable>
            </template>

            <template if:false={hasRows}>
                <div class="slds-text-color_weak">No records to display.</div>
            </template>

            <div class="slds-grid slds-grid_align-spread slds-m-top_small">
                <lightning-button label="Previous" onclick={handlePrevious} disabled={notHasPrevious}></lightning-button>
                <div class="slds-text-body_small">
                    Page {page} • {pageSize} per page • Total rows: {totalRows}
                </div>
                <lightning-button label="Next" onclick={handleNext} disabled={notHasNext}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
